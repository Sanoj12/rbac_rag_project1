name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  backend-test:
    name:backend-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r application/requirements.txt


      - name: Check Python Syntax
        run: |
        
          python -m py_compileall application
  


    frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/rbac-rag/package-lock.json


      - name: Install Frontend Dependencies
        working-directory: frontend/rbac-rag
        run: |
          npm ci


      - name: Build Next.js Application
        working-directory: frontend/rbac-rag
        run: |
          npm run build



  docker-build-and-push:
    needs: build_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/rbac-rag-chatbot1:latest \
            .

      - name: Push Backend Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/rbac-rag-chatbot1:latest